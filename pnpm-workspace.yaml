packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  '@scarf/scarf': true
  '@tree-sitter-grammars/tree-sitter-yaml': true
  core-js-pure: true
  sharp: true
  tree-sitter: true
  tree-sitter-json: true
  unrs-resolver: true
# Fuerza una sola versión de los tipos de React en todo el monorepo
overrides:
  '@types/react': ^18.3.0
  '@types/react-dom': ^18.3.0
